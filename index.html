<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVid - Pemutar Video MP4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
        }

        .logo span {
            color: #fff;
        }

        .search-bar {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background-color: #333;
            color: #fff;
            width: 250px;
        }

        /* Layout Utama */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .main-video-container {
            flex: 2;
            min-width: 300px;
        }

        .main-video-container video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
        }

        #video-title {
            margin-top: 15px;
            font-size: 22px;
        }

        #video-description {
            margin-top: 8px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Sidebar Playlist */
        .playlist-container {
            flex: 1;
            min-width: 280px;
            background-color: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            height: fit-content;
        }

        .playlist-container h3 {
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-item {
            display: flex;
            gap: 10px;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .video-item:hover {
            background-color: #333;
        }

        .video-item.active {
            background-color: #333;
            border-left: 4px solid #e50914;
        }

        .video-item img {
            width: 120px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
        }

        .video-item .info h4 {
            font-size: 14px;
            color: #fff;
        }

        .video-item .info p {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">Stream<span>Vid</span></div>
        <input type="text" placeholder="Cari video..." class="search-bar">
    </header>

    <!-- Konten Utama -->
    <div class="container">
        
        <!-- Area Pemutar Video Utama -->
        <main class="main-video-container">
            <video id="main-player" controls poster="https://via.placeholder.com/800x450?text=Klik+Video+Untuk+Memutar">
                <!-- Ganti 'video1.mp4' dengan nama file MP4 Anda -->
                <source src="video1.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutar video HTML5.
            </video>
            <h1 id="video-title">Judul Video Utama 1</h1>
            <p id="video-description">Ini adalah deskripsi dari video pertama. Anda bisa menambahkan penjelasan mengenai isi video di sini.</p>
        </main>

        <!-- Daftar Playlist Video -->
        <aside class="playlist-container">
            <h3>Daftar Video</h3>
            <div class="playlist">

                <!-- Item Video 1 -->
                <div class="video-item active" onclick="changeVideo('video1.mp4', 'Judul Video Utama 1', 'Deskripsi dari video pertama.', this)">
                    <img src="https://via.placeholder.com/120x70?text=Video+1" alt="Thumbnail 1">
                    <div class="info">
                        <h4>Judul Video Utama 1</h4>
                        <p>10:25</p>
                    </div>
                </div>

                <!-- Item Video 2 -->
                <div class="video-item" onclick="changeVideo('video2.mp4', 'Judul Video Utama 2', 'Deskripsi untuk video kedua yang dipilih.', this)">
                    <img src="https://via.placeholder.com/120x70?text=Video+2" alt="Thumbnail 2">
                    <div class="info">
                        <h4>Judul Video Utama 2</h4>
                        <p>05:40</p>
                    </div>
                </div>

                <!-- Item Video 3 -->
                <div class="video-item" onclick="changeVideo('video3.mp4', 'Judul Video Utama 3', 'Deskripsi lengkap untuk video ketiga.', this)">
                    <img src="https://via.placeholder.com/120x70?text=Video+3" alt="Thumbnail 3">
                    <div class="info">
                        <h4>Judul Video Utama 3</h4>
                        <p>12:15</p>
                    </div>
                </div>

            </div>
        </aside>

    </div>

    <!-- JavaScript terintegrasi -->
    <script>
        function changeVideo(videoSrc, title, description, element) {
            const player = document.getElementById('main-player');
            const titleElement = document.getElementById('video-title');
            const descElement = document.getElementById('video-description');

            // Mengubah sumber video dan memutarnya
            player.src = videoSrc;
            player.play();

            // Mengubah judul dan deskripsi
            titleElement.textContent = title;
            descElement.textContent = description;

            // Mengubah tanda aktif pada daftar video
            const items = document.querySelectorAll('.video-item');
            items.forEach(item => item.classList.remove('active'));
            
            element.classList.add('active');
        }
    </script>
</body>
</html>
